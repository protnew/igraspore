    for(var i=0;i<3;i++){
      org.push({t:'golgiS',x:-sz*0.25,y:sz*0.25+(i-1)*sz*0.06,rx:sz*0.1,ry:sz*0.02,rot:0,c:'#c4c'});

    var vn=1+Math.floor(sz/6);
    for(var i=0;i<vn;i++)org.push({t:'vac',x:rng(-sz*0.45,sz*0.45),y:rng(-sz*0.4,sz*0.4),r:sz*0.1,c:'#ccaa44'});
    if(b.contractile)org.push({t:'cv',x:sz*0.4,y:-sz*0.3,r:sz*0.12,c:'#66ccff'});
  }
  if(b.ribo){
    var rn=4+Math.floor(sz/4);
    for(var i=0;i<rn;i++){
      org.push({t:'ribo',x:rng(-sz*0.5,sz*0.5),y:rng(-sz*0.45,sz*0.45),r:sz*0.04,c:'#ddd'});
    }
  }
  if(b.trich){
    var tn=5+Math.floor(sz/4);
    for(var i=0;i<tn;i++){var a=i/tn*Math.PI*2;
      org.push({t:'trich',x:Math.cos(a)*sz*0.85,y:Math.sin(a)*sz*0.85,r:sz*0.03,c:'#fcc'});
    }
  }
  if(b.eye)org.push({t:'eye',x:sz*0.5,y:0,r:sz*0.08,c:'#ff6600'});
  if(b.oral)org.push({t:'oral',x:sz*0.3,y:sz*0.2,r:sz*0.12,c:'#dd8844'});
  return org;
}

function clampToPuddle(o){
  var hw=halfW(o.y);
  if(o.x<-hw){o.x=-hw;var dot=o.vx*0.819+o.vy*(-0.574);if(dot<0){o.vx-=dot*0.819;o.vy-=dot*(-0.574);o.vx*=0.85;o.vy*=0.85;}}
  if(o.x>hw){o.x=hw;var dot2=o.vx*(-0.819)+o.vy*(-0.574);if(dot2<0){o.vx-=dot2*(-0.819);o.vy-=dot2*(-0.574);o.vx*=0.85;o.vy*=0.85;}}
  if(o.y<3){o.y=3;if(o.vy<0)o.vy=-o.vy*0.4;}
  if(o.y>PD-8){o.y=PD-8;if(o.vy>0)o.vy=-o.vy*0.3;}
}

function moveOrg(o,dt){
  var sp=o.sp;
  var speed=Math.max(sp.speed,0.8)*SPD_SCALE*0.05;
  if(o.isPlayer&&!freeCam&&!autoAI&&!o.cyst&&!o.dying){
    var ax=0,ay=0;
    if(keys['w']||keys['arrowup'])ay-=1;
    if(keys['s']||keys['arrowdown'])ay+=1;
    if(keys['a']||keys['arrowleft'])ax-=1;
    if(keys['d']||keys['arrowright'])ax+=1;
    if(ax||ay){var m=Math.sqrt(ax*ax+ay*ay);ax/=m;ay/=m;o.vx+=ax*speed*dt*16;o.vy+=ay*speed*dt*16;o.angle=Math.atan2(ay,ax);}
    if(mouseDown&&!moveTarget){
      var wx=cam.x+(mx-cv.width/2)/zoom,wy=cam.y+(my-cv.height/2)/zoom;
      var dx=wx-o.x,dy=wy-o.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d>5){o.vx+=dx/d*speed*dt*16;o.vy+=dy/d*speed*dt*16;o.angle=Math.atan2(dy,dx);}
    }
    if(moveTarget){
      var dx=moveTarget.x-o.x,dy=moveTarget.y-o.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d>10){o.vx+=dx/d*speed*dt*16;o.vy+=dy/d*speed*dt*16;o.angle=Math.atan2(dy,dx);}
      else moveTarget=null;
    }
  }else if(!o.isPlayer&&!o.cyst&&!o.dying){aiOrg(o,dt,speed);}
  else if(o.isPlayer&&autoAI&&!o.cyst&&!o.dying){aiOrg(o,dt,speed);}
  var damp=o.isPlayer&&!freeCam?0.86:0.93;
  o.vx*=Math.pow(damp,dt*60);o.vy*=Math.pow(damp,dt*60);
  if(o.sp.cat==='producer'){o.vy-=0.15*dt;}
  if(o.sp.cat==='decomposer'){o.vy+=0.2*dt;}
  if(settings.currents&&!o.dying){
    for(var i=0;i<currents.length;i++){
      var c=currents[i];var dd=(o.x-c.x)*(o.x-c.x)+(o.y-c.y)*(o.y-c.y);
      if(dd<c.r*c.r){var inf=(1-Math.sqrt(dd)/c.r)*c.strength;o.vx+=c.vx*inf*dt;o.vy+=c.vy*inf*dt;}
    }
  }
  o.x+=o.vx*dt*60;o.y+=o.vy*dt*60;
  clampToPuddle(o);
  // Glide trail for motile organisms
  if(o.glideTrail&&(Math.abs(o.vx)+Math.abs(o.vy)>1)&&fc%4===0){
    o.glideTrail.push({x:o.x,y:o.y,life:1});
    if(o.glideTrail.length>8)o.glideTrail.shift();
  }
  if(o.glideTrail)for(var i=o.glideTrail.length-1;i>=0;i--){o.glideTrail[i].life-=dt*1.5;if(o.glideTrail[i].life<=0)o.glideTrail.splice(i,1);}
  o.wobble+=dt*2;o.pulse+=dt*1.5;o.flagPhase+=dt*8;o.cilPhase+=dt*14;
  if(!o.isPlayer||autoAI||freeCam){
    var vmag=Math.abs(o.vx)+Math.abs(o.vy);
    if(vmag>0.3)o.angle=lerp(o.angle,Math.atan2(o.vy,o.vx),0.08);
  }
  if(o.divCD>0)o.divCD-=dt;
}

function aiOrg(o,dt,speed){
  var cat=o.sp.cat,foodCats=FOOD[cat]||[];
  o.state='idle';
  // Skip eating during division cooldown
  if(o.divCD>0)return;
  var prey=null,pd2=999999;
  if(foodCats.length>0&&o.energy<85){
    for(var i=0;i<orgs.length;i++){
      var p=orgs[i];
      if(!p.alive||p===o||p.cyst||p.divCD>0)continue;
      if(foodCats.indexOf(p.sp.cat)<0)continue;
      if(p.size>=o.size*0.88)continue;
      var d=dist2(o,p);if(d<pd2){pd2=d;prey=p;}
    }
  }
  if(prey&&pd2<(o.size+prey.sp.size+30)*(o.size+prey.sp.size+30)){eatOrg(o,prey);return;}
  if(prey&&pd2<350*350){
    o.state='hunt';
    var dx=prey.x-o.x,dy=prey.y-o.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d>1){o.vx+=dx/d*speed*dt*12;o.vy+=dy/d*speed*dt*12;o.angle=Math.atan2(dy,dx);}
    return;
  }
  for(var i=0;i<orgs.length;i++){
    var q=orgs[i];
    if(!q.alive||q===o)continue;
    if(FOOD[q.sp.cat]&&FOOD[q.sp.cat].indexOf(cat)>=0&&q.size>o.size*0.88){
      var d=dist2(o,q);
      if(d<180*180){
        o.state='flee';var dx=o.x-q.x,dy=o.y-q.y,dd=Math.sqrt(dx*dx+dy*dy);
        if(dd>1){o.vx+=dx/dd*speed*dt*14;o.vy+=dy/dd*speed*dt*14;o.angle=Math.atan2(dy,dx);}
        return;
      }
    }
  }
  if(cat==='producer'){
    var lightHere=lightAt(o.y);
    if(lightHere<0.3&&o.y>200)o.vy-=speed*dt*4;
    o.vx+=rng(-0.3,0.3)*speed*dt*5;o.vy+=rng(-0.2,0.2)*speed*dt*5;return;
  }
  o.vx+=rng(-0.4,0.4)*speed*dt*6;o.vy+=rng(-0.3,0.3)*speed*dt*6;
}

function eatOrg(pred,prey){
  if(!prey.alive||prey.divCD>0)return;
  var gain=prey.energy*0.55+prey.size*1.5;
  pred.energy=Math.min(110,pred.energy+gain);
  pred.eaten++;pred.flash=0.3;pred.flashColor='#ff8';
  killOrg(prey,DCODE.EATEN);
  if(settings.particles)for(var i=0;i<8;i++)parts.push({x:prey.x,y:prey.y,vx:rng(-3,3),vy:rng(-3,3),life:1,maxL:1,size:rng(2,5),color:prey.sp.color});
}

function killOrg(o,cause){
  if(!o.alive)return;
  o.alive=false;o.dying=true;o.deathT=0;o.deathCause=cause;
  if(speciesPop[o.species]){speciesPop[o.species].alive--;speciesPop[o.species].deaths[cause]++;}
  stats.deaths++;stats.deathCauses[cause]++;
}

function doDivide(o){
  if(o.dividing||o.energy<o.sp.repEnergy||o.age<o.sp.minAge||o.divCD>0)return;
  o.dividing=true;o.divT=0;o.state='dividing';
}
function finishDivide(o){
  o.dividing=false;o.energy*=0.5;
  // KEY FIX: push child AWAY with separation impulse + cooldown
  var pushAng=rng(0,Math.PI*2);
  var cx=o.x+Math.cos(pushAng)*DIV_SEPARATION;
  var cy=o.y+Math.sin(pushAng)*DIV_SEPARATION;
  // Clamp child to puddle
  var hw=halfW(cy)-15;cx=clamp(cx,-hw,hw);cy=clamp(cy,5,PD-10);
  var child=spawnOrg(o.sp,cx,cy);
  if(child){
    child.generation=o.generation+1;child.energy=o.energy*0.9;
    child.size=o.size*rng(0.92,1.05);
    child.divCD=DIV_COOLDOWN;
    // Push apart
    var pushForce=3;
    o.vx+=Math.cos(pushAng)*pushForce;o.vy+=Math.sin(pushAng)*pushForce;
    child.vx-=Math.cos(pushAng)*pushForce;child.vy-=Math.sin(pushAng)*pushForce;
    o.offspring++;
  }
  o.divCD=DIV_COOLDOWN;
  o.flash=0.4;o.flashColor='#8f8';
  if(settings.particles)for(var i=0;i<6;i++)parts.push({x:o.x,y:o.y,vx:rng(-2,2),vy:rng(-2,2),life:1,maxL:1,size:rng(2,4),color:'#8f8'});
}
function doCyst(o){o.cyst=!o.cyst;o.cystT=0;}

// === VIRUS INFECTION ===
function spawnVirus(){
  if(viruses.length>30)return;
  var vi=Math.floor(Math.random()*VIRUS_SPECS.length);
  var vs=VIRUS_SPECS[vi];
  var d=rng(50,PD-50),hw=halfW(d)-20;
  viruses.push({x:rng(-hw,hw),y:d,vx:rng(-0.5,0.5),vy:rng(-0.5,0.5),
    sp:vs,target:null,age:0,angle:rng(0,Math.PI*2),wobble:rng(0,Math.PI*2)});
}
function updateViruses(dt){
  var vr=settings.virusRate*DIFF[difficulty].virus;
  virusT+=dt;
  if(virusT>8/vr){virusT=0;spawnVirus();}
  for(var i=viruses.length-1;i>=0;i--){
    var v=viruses[i];v.age+=dt;
    v.wobble+=dt*3;
    // Find target bacteria
    if(!v.target||!v.target.alive){
      v.target=null;
      for(var j=0;j<orgs.length;j++){
        var o=orgs[j];
        if(o.alive&&!o.infected&&o.sp.cat==='consumer1'&&dist2(v,o)<300*300){v.target=o;break;}
      }
    }
    if(v.target&&v.target.alive){
      var dx=v.target.x-v.x,dy=v.target.y-v.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<5){v.target.infected=true;v.target.infectionT=0;viruses.splice(i,1);continue;}
      v.vx+=dx/d*0.5*dt*60;v.vy+=dy/d*0.5*dt*60;
    }
    v.vx*=0.95;v.vy*=0.95;
    v.x+=v.vx*dt*60;v.y+=v.vy*dt*60;
    v.angle=Math.atan2(v.vy,v.vx);
    // Remove old viruses
    if(v.age>60)viruses.splice(i,1);
  }
}
function updateInfections(dt){
  for(var i=0;i<orgs.length;i++){
    var o=orgs[i];
    if(o.infected&&o.alive&&!o.dying){
      o.infectionT+=dt;
      o.flash=Math.max(o.flash,0.15);o.flashColor='#f44';
      // Lysis after 15-25 seconds
      if(o.infectionT>15+rng(0,10)){
        // Release new viruses + die
        var numNew=4+Math.floor(Math.random()*4);
        for(var v=0;v<numNew;v++){
          viruses.push({x:o.x+rng(-5,5),y:o.y+rng(-5,5),vx:rng(-2,2),vy:rng(-2,2),
            sp:VIRUS_SPECS[Math.floor(Math.random()*VIRUS_SPECS.length)],
            target:null,age:0,angle:rng(0,Math.PI*2),wobble:rng(0,Math.PI*2)});
        }
        killOrg(o,DCODE.LYSIS);
        if(settings.particles)for(var p=0;p<12;p++)parts.push({x:o.x,y:o.y,vx:rng(-4,4),vy:rng(-4,4),life:1,maxL:1,size:rng(2,5),color:'#f44'});
      }
    }
  }
}

function updateOrg(o,dt){
  if(o.dying){o.deathT+=dt;o.size*=Math.pow(0.95,dt*60);if(o.deathT>1.2)o._remove=true;return;}
  if(!o.alive)return;
  o.age+=dt;
  var metab=0.12*DIFF[difficulty].metab;
  if(o.sp.cat==='producer'){
    var photo=lightAt(o.y)*0.7;var nutr=0;
    for(var n=0;n<nutrientClouds.length;n++){if(dist2(o,nutrientClouds[n])<nutrientClouds[n].r*nutrientClouds[n].r){nutr=nutrientClouds[n].intensity*0.3;break;}}
    o.energy+=(photo+nutr-metab)*dt*DIFF[difficulty].energy;
  }else{o.energy-=metab*dt*DIFF[difficulty].energy;}
  var s=SEASONS[season];
  if(s.temp<o.sp.tempRange[0]||s.temp>o.sp.tempRange[1]+8){
    o.energy-=0.25*dt;
    if(o.energy<5&&Math.random()<0.002*dt){killOrg(o,DCODE.TEMP);return;}
  }
  if(o.cyst){o.energy-=0.015*dt;o.cystT+=dt;if(o.cystT>25){o.cyst=false;o.cystT=0;}}
  else moveOrg(o,dt);
  if(o.dividing){o.divT+=dt;if(o.divT>1.3)finishDivide(o);}
  if(!o.isPlayer&&!o.dividing&&!o.cyst&&o.energy>o.sp.repEnergy&&o.age>o.sp.minAge&&o.divCD<=0){
    if(Math.random()<0.02*dt)doDivide(o);
  }
  if(o.energy<=0){killOrg(o,DCODE.STARVE);return;}
  if(o.sp.isEuk&&o.age>500){o.energy-=0.15*dt;if(o.energy<5&&Math.random()<0.004*dt){killOrg(o,DCODE.AGE);return;}}
  var tgtSz=o.sp.size*(0.65+clamp(o.energy/75,0,1)*0.55);
  o.size=lerp(o.size,tgtSz,0.02*dt);
  if(o.flash>0)o.flash=Math.max(0,o.flash-dt*2);
}

function updateWorld(dt){
  dt*=timeScale;
  for(var i=0;i<orgs.length;i++)updateOrg(orgs[i],dt);
  updateInfections(dt);
  updateViruses(dt);
  for(var i=orgs.length-1;i>=0;i--){
    if(orgs[i]._remove){if(orgs[i].isPlayer&&state==='playing')state='gameover';orgs.splice(i,1);}
  }
  spawnT+=dt;
  if(spawnT>2.5){
    spawnT=0;
    for(var cat in TGT){
      var cnt=0;for(var j=0;j<orgs.length;j++)if(orgs[j].alive&&orgs[j].sp.cat===cat)cnt++;
      if(cnt<TGT[cat]*DIFF[difficulty].spawn*settings.density){
        var pool=SPECIES_DB.filter(function(s){return s.cat===cat;});
        if(pool.length>0){var sp=pool[Math.floor(Math.random()*pool.length)];var d=rng(20,PD-30),hw=halfW(d)-25;spawnOrg(sp,rng(-hw,hw),d);}
      }
    }
  }
  if(settings.bubbles){
    if(Math.random()<0.08){var bd=rng(PD*0.5,PD-10),bhw=halfW(bd)-10;o2Bubbles.push({x:rng(-bhw,bhw),y:bd,vy:-rng(0.5,1.5),r:rng(2,5),life:1});}
    for(var i=o2Bubbles.length-1;i>=0;i--){var b=o2Bubbles[i];b.y+=b.vy*dt*60;b.x+=rng(-0.3,0.3)*dt*60;b.life-=dt*0.08;if(b.y<5||b.life<=0)o2Bubbles.splice(i,1);}
  }
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vx*=0.95;p.vy*=0.95;p.life-=dt/p.maxL;if(p.life<=0)parts.splice(i,1);}
  for(var i=0;i<currents.length;i++){currents[i].x+=currents[i].vx*dt;currents[i].y+=currents[i].vy*dt;if(Math.abs(currents[i].x)>PW)currents[i].vx*=-1;if(currents[i].y<50||currents[i].y>PD-50)currents[i].vy*=-1;}
  tod+=dt/DAY_SEC*24;
  if(tod>=24){tod-=24;totalDays++;var ns=Math.floor(totalDays/SEASON_DAYS)%4;if(ns!==season)season=ns;}
  updateTodUI();
  dayLight=Math.max(0,Math.sin((tod-6)/24*Math.PI*2)*0.5+0.35)*SEASONS[season].light;
  rainTimer+=dt;
  if(rainTimer>25+Math.random()*40){rainTimer=0;isRaining=Math.random()<SEASONS[season].rain;if(isRaining){wind.strength=rng(0.3,0.8);wind.x=rng(-1,1)*wind.strength;wind.y=0;}else{wind.x=0;wind.y=0;}}
  if(isRaining&&settings.particles)for(var i=0;i<2;i++)rainDrops.push({x:cam.x+rng(-cv.width/2/zoom,cv.width/2/zoom),y:cam.y-cv.height/2/zoom,vy:rng(8,14),vx:wind.x*2,life:1});
  for(var i=rainDrops.length-1;i>=0;i--){var rd=rainDrops[i];rd.y+=rd.vy*dt*60;rd.x+=rd.vx*dt*60;rd.life-=dt*0.3;if(rd.life<=0||rd.y>PD)rainDrops.splice(i,1);}
  updateCamera(dt);
  var curPop=0;for(var i=0;i<orgs.length;i++)if(orgs[i].alive)curPop++;
  if(curPop>gameStats.maxPop)gameStats.maxPop=curPop;
  if(player&&player.size>gameStats.maxPlayerSize)gameStats.maxPlayerSize=player.size;
  if(fc%90===0){var snap={};for(var cat in CC){var c=0;for(var j=0;j<orgs.length;j++)if(orgs[j].alive&&orgs[j].sp.cat===cat)c++;snap[cat]=c;}popHist.push(snap);if(popHist.length>100)popHist.shift();}
}

function updateCamera(dt){
  zoom=lerp(zoom,tZoom,clamp(dt*8,0,1));
  if(!freeCam&&player&&player.alive){cam.x=lerp(cam.x,player.x,clamp(dt*4,0,1));cam.y=lerp(cam.y,player.y,clamp(dt*4,0,1));}
  else if(freeCam){var cs=400/zoom*dt*60;if(camKeys.w)cam.y-=cs;if(camKeys.s)cam.y+=cs;if(camKeys.a)cam.x-=cs;if(camKeys.d)cam.x+=cs;cam.x=clamp(cam.x,-PW-200,PW+200);cam.y=clamp(cam.y,-100,PD+100);}
}
function updateTodUI(){
  if(!sliderDragging){var sl=document.getElementById('todR');if(sl)sl.value=tod;}
  var lbl=document.getElementById('todL');if(lbl){var h=Math.floor(tod),m=Math.floor((tod-h)*60);lbl.textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m;}
  var sl=document.getElementById('seasL');if(sl)sl.textContent=tt('season'+season);
}

function render(){
  ctx.fillStyle='#000814';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save();ctx.translate(cv.width/2,cv.height/2);ctx.scale(zoom,zoom);ctx.translate(-cam.x,-cam.y);
  var vw=cv.width/zoom,vh=cv.height/zoom,vL=cam.x-vw/2,vR=cam.x+vw/2,vT=cam.y-vh/2,vB=cam.y+vh/2;
  renderSky(vL,vR,vT);renderWater(vL,vR,vT,vB);renderSunRays(vL,vR);renderSediment(vL,vR,vB);
  renderNutrients(vL,vR,vT,vB);renderShore(vL,vR,vT);
  if(settings.shadows)renderShadows(vL,vR,vT,vB);
  if(settings.bubbles)renderBubbles(vL,vR,vT,vB);
  renderTrails(vL,vR,vT,vB);
  renderOrganisms(vL,vR,vT,vB);
  renderViruses(vL,vR,vT,vB);
  renderParticles(vL,vR,vT,vB);
  if(isRaining)renderRain(vL,vR,vT);
  if(moveTarget)renderTarget();
  ctx.restore();
  renderDayNight();
  if(settings.healthBars)renderHealthBars();
  renderTooltip();
}

function renderSky(vL,vR,vT){
  if(vT>=0)return;
  var g=ctx.createLinearGradient(0,vT,0,0);
  if(dayLight>0.5){g.addColorStop(0,'#1a3050');g.addColorStop(1,'#3a6090');}
  else{g.addColorStop(0,'#050818');g.addColorStop(1,'#0a1228');}
  ctx.fillStyle=g;ctx.fillRect(vL,vT,vR-vL,-vT);
  if(dayLight>0.1){
    var sunX=Math.sin((tod-6)/24*Math.PI*2)*PW*0.7,sunY=-Math.abs(Math.sin((tod-6)/24*Math.PI*2))*300-50;
    if(sunY>vT){ctx.save();ctx.globalAlpha=dayLight;
      var sg=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,80);
      sg.addColorStop(0,'rgba(255,240,180,0.9)');sg.addColorStop(0.3,'rgba(255,200,100,0.4)');sg.addColorStop(1,'rgba(255,180,50,0)');
      ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sunX,sunY,80,0,Math.PI*2);ctx.fill();ctx.restore();}
  }
}
function renderWater(vL,vR,vT,vB){
  var steps=30;
  for(var i=0;i<steps;i++){
    var y0=i/steps*PD,y1=(i+1)/steps*PD;
    if(y1<vT||y0>vB)continue;
    var hw0=halfW(y0),hw1=halfW(y1);var light=lightAt(y0);
    var r=10+light*20,g=35+light*35,b=45+light*25;
    if(season===3&&y0<50){r=180;g=195;b=210;}
    ctx.fillStyle='rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';

  ctx.strokeStyle='rgba(100,80,50,0.4)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-PW,0);ctx.lineTo(-BW,PD);ctx.moveTo(PW,0);ctx.lineTo(BW,PD);ctx.stroke();

function renderSunRays(vL,vR){

function renderOrg(o){
  ctx.save();ctx.translate(o.x,o.y);
  var sz=o.size,rgb=hex2rgb(o.sp.color);
  var tint=o.energy<25?0.5:(o.energy>90?1.2:1);
  var bc=shadeRgb(rgb[0],rgb[1],rgb[2],tint),bd=shadeRgb(rgb[0],rgb[1],rgb[2],tint*0.5);
  if(o.dying)ctx.globalAlpha=clamp(1-o.deathT/1.2,0,1);
  if(o.cyst){ctx.fillStyle='rgba(180,160,80,0.35)';ctx.beginPath();ctx.arc(0,0,sz*1.4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(200,180,100,0.5)';ctx.lineWidth=2;ctx.stroke();}
  // Infected overlay
  if(o.infected){ctx.fillStyle='rgba(255,50,50,0.15)';ctx.beginPath();ctx.arc(0,0,sz*1.2,0,Math.PI*2);ctx.fill();}
  if(o.dividing){
    var dp=o.divT/1.3;
    ctx.save();ctx.translate(-sz*dp*0.3,0);drawBody(o,sz*(1-dp*0.15),bc,bd);drawOrgans(o,sz*(1-dp*0.15));ctx.restore();
    ctx.save();ctx.translate(sz*dp*0.3,0);drawBody(o,sz*(1-dp*0.15),bc,bd);drawOrgans(o,sz*(1-dp*0.15));ctx.restore();
    ctx.restore();return;}
  ctx.rotate(o.angle+Math.sin(o.wobble)*0.04);
  drawBody(o,sz,bc,bd);
  if(zoom>4)drawOrgans(o,sz);
  if(zoom>2.5)drawAppendages(o,sz);
  if(o.flash>0){ctx.globalAlpha=o.flash;ctx.fillStyle=o.flashColor;ctx.beginPath();ctx.arc(0,0,sz,0,Math.PI*2);ctx.fill();}
  if(o.isPlayer&&state==='playing'){ctx.globalAlpha=0.5+Math.sin(fc*0.1)*0.3;ctx.strokeStyle='#4ff';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,sz+4,0,Math.PI*2);ctx.stroke();}
  ctx.restore();
}
function drawBody(o,sz,fc2,fd){
  var sh=o.sp.shape;ctx.fillStyle=fc2;ctx.strokeStyle=fd;ctx.lineWidth=Math.max(1,sz*0.08);ctx.beginPath();
  if(sh==='circle')ctx.arc(0,0,sz,0,Math.PI*2);
  else if(sh==='rod')ctx.ellipse(0,0,sz*1.3,sz*0.6,0,0,Math.PI*2);
  else if(sh==='spiral'){for(var i=0;i<=30;i++){var t=i/30*Math.PI*3,r=sz*0.8;var px=Math.cos(t)*r*(1-t/12),py=Math.sin(t)*r*(1-t/12);if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}}
  else if(sh==='filament')ctx.ellipse(0,0,sz*2,sz*0.3,0,0,Math.PI*2);
  else if(sh==='colony'){ctx.arc(0,0,sz,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(100,200,100,0.5)';
    for(var i=0;i<8;i++){var a=i/8*Math.PI*2;ctx.beginPath();ctx.arc(Math.cos(a)*sz*0.7,Math.sin(a)*sz*0.7,sz*0.15,0,Math.PI*2);ctx.fill();}return;}
  else if(sh==='star'){var pts=12;for(var i=0;i<=pts*2;i++){var a=i/(pts*2)*Math.PI*2,r=i%2===0?sz*1.3:sz*0.6;if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}}
  else if(sh==='slipper'){ctx.moveTo(sz,0);ctx.bezierCurveTo(sz,-sz*0.65,-sz*0.8,-sz*0.65,-sz,0);ctx.bezierCurveTo(-sz*0.8,sz*0.65,sz,sz*0.65,sz,0);}
  else if(sh==='bell'){ctx.moveTo(0,-sz);ctx.bezierCurveTo(sz*0.8,-sz*0.9,sz*0.9,sz*0.3,0,sz*0.5);ctx.bezierCurveTo(-sz*0.9,sz*0.3,-sz*0.8,-sz*0.9,0,-sz);}
  else if(sh==='oval')ctx.ellipse(0,0,sz*1.1,sz*0.7,0,0,Math.PI*2);
  else if(sh==='irregular'){var lobes=5+Math.floor(o.wobble)%3;
    for(var i=0;i<=40;i++){var a=i/40*Math.PI*2;var r=sz+Math.sin(a*lobes+o.wobble)*sz*0.25+Math.sin(a*3+o.pulse)*sz*0.1;if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}}
  else ctx.arc(0,0,sz,0,Math.PI*2);
  ctx.fill();
  // Pellicle strips for ciliates
  if(o.sp.bio.pellicle&&zoom>5){ctx.strokeStyle='rgba(180,140,60,0.3)';ctx.lineWidth=1;
    for(var s=-sz*0.8;s<sz*0.8;s+=sz*0.15){ctx.beginPath();ctx.moveTo(s,-sz*0.5);ctx.lineTo(s,sz*0.5);ctx.stroke();}}
  if(o.sp.bio.wall)ctx.lineWidth=Math.max(2,sz*0.12);
  ctx.stroke();
  if(o.sp.biolum&&dayLight<0.35){ctx.shadowColor=o.sp.color;ctx.shadowBlur=sz*2;ctx.fillStyle='rgba(100,255,200,0.25)';ctx.beginPath();ctx.arc(0,0,sz*0.6,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
}
function drawOrgans(o,sz){
  var org=o.organs;if(!org)return;
  for(var i=0;i<org.length;i++){
    var g=org[i];ctx.save();ctx.globalAlpha=0.8;
    if(g.t==='nuc'||g.t==='nuc2'||g.t==='eye'){ctx.fillStyle=g.c;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();}
    else if(g.t==='mac'){ctx.fillStyle=g.c;ctx.beginPath();ctx.ellipse(g.x,g.y,g.r,g.r*0.6,0,0,Math.PI*2);ctx.fill();}
    else if(g.t==='mic'){ctx.fillStyle=g.c;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();}

    else if(g.t==='golgi'){ctx.fillStyle=g.c;ctx.globalAlpha=0.4;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();}
    else if(g.t==='golgiS'){ctx.fillStyle=g.c;ctx.globalAlpha=0.5;ctx.save();ctx.translate(g.x,g.y);ctx.beginPath();ctx.ellipse(0,0,g.rx,g.ry,0,0,Math.PI*2);ctx.fill();ctx.restore();}
    else if(g.t==='er'){ctx.fillStyle=g.c;ctx.globalAlpha=0.3;ctx.save();ctx.translate(g.x,g.y);ctx.rotate(g.rot);ctx.beginPath();ctx.ellipse(0,0,g.rx,g.ry,0,0,Math.PI*2);ctx.fill();ctx.restore();}
    else if(g.t==='vac'){ctx.fillStyle=g.c;ctx.globalAlpha=0.45;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();}
    else if(g.t==='cv'){var pr=g.r+Math.sin(o.pulse*2)*g.r*0.3;ctx.fillStyle=g.c;ctx.globalAlpha=0.6;ctx.beginPath();ctx.arc(g.x,g.y,Math.max(1,pr),0,Math.PI*2);ctx.fill();}
    else if(g.t==='ribo'){ctx.fillStyle=g.c;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();}
    else if(g.t==='trich'){ctx.fillStyle=g.c;ctx.save();ctx.translate(g.x,g.y);ctx.rotate(Math.atan2(g.y,g.x));ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(sz*0.15,0);ctx.lineTo(0,sz*0.02);ctx.closePath();ctx.fill();ctx.restore();}
    else if(g.t==='oral'){ctx.fillStyle=g.c;ctx.globalAlpha=0.4;ctx.beginPath();ctx.ellipse(g.x,g.y,g.r,g.r*0.6,0,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
}
function drawAppendages(o,sz){
  var b=o.sp.bio;ctx.save();ctx.strokeStyle='rgba(200,220,255,0.35)';ctx.lineWidth=Math.max(1,sz*0.05);
  if(b.flag){var fn=b.chain?3:1;
    for(var f=0;f<fn;f++){ctx.beginPath();var sx=-sz*0.9+(f-fn/2)*sz*0.15;
      ctx.moveTo(sx,0);for(var w=0;w<10;w++){var t=w/10;var wx=sx-t*sz*1.4;var wy=Math.sin(o.flagPhase+w*0.7+f)*sz*0.35;ctx.lineTo(wx,wy);}ctx.stroke();}}
  if(b.cilia){var cn=10+Math.floor(sz/3);
    for(var c=0;c<cn;c++){var a=c/cn*Math.PI*2;var wave=Math.sin(o.cilPhase+c*0.5)*sz*0.15;var r1=sz*0.9,r2=sz*1.15+wave;
      ctx.beginPath();ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);ctx.stroke();}
    // Metachronal wave (cilia beat pattern)
    if(zoom>6){ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;ctx.beginPath();
      for(var c=0;c<cn;c++){var a=c/cn*Math.PI*2;var beat=Math.sin(o.cilPhase+c*0.3)*0.5+0.5;var r=sz*(0.95+beat*0.2);
        if(c===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
      ctx.closePath();ctx.stroke();}}
  if(b.pseudo){var pn=5;
    for(var p=0;p<pn;p++){var a=p/pn*Math.PI*2+Math.sin(o.wobble)*0.3;var ext=sz*0.4+Math.sin(o.pulse+p*1.5)*sz*0.35;
      ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(Math.cos(a)*sz*0.7,Math.sin(a)*sz*0.7,Math.cos(a)*(sz+ext),Math.sin(a)*(sz+ext));
      ctx.lineWidth=Math.max(2,sz*0.12);ctx.strokeStyle='rgba(200,220,255,0.15)';ctx.stroke();}}
  if(b.stalk){ctx.strokeStyle='rgba(150,130,80,0.4)';ctx.lineWidth=Math.max(1,sz*0.06);
    ctx.beginPath();ctx.moveTo(0,sz*0.5);

  ctx.restore();
}
function renderViruses(vL,vR,vT,vB){

function renderHealthBars(){
  ctx.save();
  for(var i=0;i<orgs.length;i++){var o=orgs[i];if(!o.alive||o.dying)continue;
    var scx=(o.x-cam.x)*zoom+cv.width/2,scy=(o.y-cam.y)*zoom+cv.height/2;
    if(scx<5||scx>cv.width-5||scy<5||scy>cv.height-5)continue;

    var bw=Math.max(14,o.size*zoom*1.1),bh=3,bx=scx-bw/2,by=scy-o.size*zoom-6;

function renderTooltip(){

  for(var i=orgs.length-1;i>=0;i--){var o=orgs[i];if(!o.alive)continue;if(dist2({x:wx,y:wy},o)<(o.size+5)*(o.size+5)){inspOrg=o;break;}}
  var tip=document.getElementById('tip');

function renderMinimap(){
  mc.clearRect(0,0,110,80);mc.fillStyle='rgba(0,12,28,0.85)';mc.fillRect(0,0,110,80);
  var sx=100/(PW*2),sy=70/PD;mc.save();mc.translate(5,5);
  mc.fillStyle='rgba(20,50,60,0.5)';mc.beginPath();mc.moveTo(0,0);mc.lineTo(100,0);mc.lineTo(100-(PW-BW)*sx,70);mc.lineTo((PW-BW)*sx,70);mc.closePath();mc.fill();
  for(var i=0;i<orgs.length;i++){var o=orgs[i];if(!o.alive)continue;mc.fillStyle=o.sp.color;mc.beginPath();mc.arc((o.x+PW)*sx,o.y*sy,o.isPlayer?3:1,0,Math.PI*2);mc.fill();}
  mc.restore();
  var vw=cv.width/zoom,vh=cv.height/zoom;mc.strokeStyle='rgba(100,200,255,0.4)';mc.lineWidth=1;
  mc.strokeRect(5+(cam.x-vw/2+PW)*sx,5+(cam.y-vh/2)*sy,vw*sx,vh*sy);
}
function renderPopGraph(){
  pcc.clearRect(0,0,110,55);pcc.fillStyle='rgba(0,12,28,0.6)';pcc.fillRect(0,0,110,55);
  if(popHist.length<2)return;var maxP=1;
  for(var i=0;i<popHist.length;i++){var t=0;for(var c in popHist[i])t+=popHist[i][c];if(t>maxP)maxP=t;}
  var cats=['producer','consumer1','consumer2','consumer3','decomposer'];
  var cols={producer:'#2c2',consumer1:'#4af',consumer2:'#f80',consumer3:'#c4f',decomposer:'#a86'};
  for(var ci=0;ci<cats.length;ci++){pcc.strokeStyle=cols[cats[ci]];pcc.lineWidth=1.5;pcc.beginPath();
    for(var i=0;i<popHist.length;i++){var x=i/(popHist.length-1)*110;var y=55-(popHist[i][cats[ci]]||0)/maxP*52;if(i===0)pcc.moveTo(x,y);else pcc.lineTo(x,y);}pcc.stroke();}
}

  var cats=[['producer',tt('producer')],['consumer1',tt('consumer1')],['consumer2',tt('consumer2')],['consumer3',tt('consumer3')],['decomposer',tt('decomposer')],['virus',tt('virus')]];
  for(var ci=0;ci<cats.length;ci++){
    var cat=cats[ci][0],catName=cats[ci][1];
    if(cat==='virus'){
      var hasVirus=false;
      for(var vi=0;vi<VIRUS_SPECS.length;vi++){var vs=VIRUS_SPECS[vi];
        if(search&&vs.name.toLowerCase().indexOf(search)<0)continue;

          '<div class="wf">'+(curLang==='ru'?'\u0411\u0430\u043a\u0442\u0435\u0440\u0438\u043e\u0444\u0430\u0433. \u0417\u0430\u0440\u0430\u0436\u0430\u0435\u0442 \u0431\u0430\u043a\u0442\u0435\u0440\u0438\u0438, \u0432\u044b\u0437\u044b\u0432\u0430\u0435\u0442 \u043b\u0438\u0437\u0438\u0441 \u0438 \u0432\u044b\u043f\u0443\u0441\u043a\u0430\u0435\u0442 \u0434\u043e 8 \u043d\u043e\u0432\u044b\u0445 \u0447\u0430\u0441\u0442\u0438\u0446.':'Bacteriophage. Infects bacteria, causes lysis, releases up to 8 new virions.')+'</div></div>';
      }
      continue;
    }
    var pool=SPECIES_DB.filter(function(s){return s.cat===cat;});
    if(pool.length===0)continue;
    if(search){
      pool=pool.filter(function(s){return s.name.toLowerCase().indexOf(search)>=0;});
      if(pool.length===0)continue;
    }
    html+='<div class="wiki-cat" style="color:'+CC[cat]+'">'+catName+' ('+pool.length+')</div>';
    for(var si=0;si<pool.length;si++){
      var sp=pool[si];var w=getWikiEntry(sp.id);
      var organs=[];
      if(sp.bio.chloro)organs.push(curLang==='ru'?'\u0445\u043b\u043e\u0440\u043e\u043f\u043b\u0430\u0441\u0442\u044b':'chloroplasts');
      if(sp.bio.nucleus)organs.push(curLang==='ru'?'\u044f\u0434\u0440\u043e':'nucleus');
      if(sp.bio.macro)organs.push(curLang==='ru'?'\u043c\u0430\u043a\u0440\u043e/\u043c\u0438\u043a\u0440\u043e\u043d\u0443\u043a\u043b\u0435\u0443\u0441':'macro/micronucleus');
      if(sp.bio.cilia)organs.push(curLang==='ru'?'\u0440\u0435\u0441\u043d\u0438\u0447\u043a\u0438':'cilia');
      if(sp.bio.flag)organs.push(curLang==='ru'?'\u0436\u0433\u0443\u0442\u0438\u043a':'flagella');
      if(sp.bio.pseudo)organs.push(curLang==='ru'?'\u043f\u0441\u0435\u0432\u0434\u043e\u043f\u043e\u0434\u0438\u0438':'pseudopodia');
      if(sp.bio.mito)organs.push(curLang==='ru'?'\u043c\u0438\u0442\u043e\u0445\u043e\u043d\u0434\u0440\u0438\u0438':'mitochondria');
      if(sp.bio.golgi)organs.push(curLang==='ru'?'\u0433\u043e\u043b\u044c\u0434\u0436\u0438':'Golgi');
      if(sp.bio.trich)organs.push(curLang==='ru'?'\u0442\u0440\u0438\u0445\u043e\u0446\u0438\u0441\u0442\u044b':'trichocysts');
      if(sp.bio.contractile)organs.push(curLang==='ru'?'\u0441\u043e\u043a\u0440. \u0432\u0430\u043a\u0443\u043e\u043b\u044c':'contractile vacuole');
      html+='<div class="wiki-entry"><b style="color:'+sp.color+'">'+sp.name+'</b>'+
        '<div class="wl">'+sp.size+'\u03bcm \u00b7 '+sp.speed+'\u03bcm/s \u00b7 '+sp.locomotion+'</div>'+
        '<div class="wf"><b>'+(curLang==='ru'?'\u0414\u0432\u0438\u0436\u0435\u043d\u0438\u0435':'Locomotion')+':</b> '+w.loc+
        ' \u00b7 <b>'+(curLang==='ru'?'\u0414\u0435\u043b\u0435\u043d\u0438\u0435':'Division')+':</b> '+w.div+
        ' \u00b7 <b>'+(curLang==='ru'?'\u041f\u0438\u0449\u0430':'Food')+':</b> '+w.food+
        ' \u00b7 <b>'+(curLang==='ru'?'\u0412\u0440\u0430\u0433\u0438':'Predators')+':</b> '+w.pred+'</div>'+
        (organs.length?'<div style="color:#678;font-size:9px;margin-top:2px"><b>'+(curLang==='ru'?'\u041e\u0440\u0433\u0430\u043d\u0435\u043b\u043b\u044b':'Organelles')+':</b> '+organs.join(', ')+'</div>':'')+
        '</div>';
    }
  }
  wc.innerHTML=html;
}

function gameLoop(ts){
  if(!lastT)lastT=ts;
  var dt=Math.min(0.05,(ts-lastT)/1000);lastT=ts;fc++;gt+=dt;
  fAcc+=dt;fCnt++;if(fAcc>=0.5){fps=Math.round(fCnt/fAcc);fAcc=0;fCnt=0;}
  if(state==='playing'){
    updateWorld(dt);updateHUD();updateTopRight();updateWeather();updateEcoPanel();updateLegend();
    if(fc%5===0)renderMinimap();if(fc%10===0)renderPopGraph();
    var cm=document.getElementById('camM');
    if(freeCam){cm.textContent=tt('freeCam');cm.className='free';cm.style.display='block';}
    else if(autoAI){cm.textContent=tt('autoOn');cm.className='';cm.style.display='block';}
    else cm.style.display='none';
    if(gt>15)document.getElementById('keyHint').style.opacity='0.3';
  }else if(state==='gameover'){showDeadScreen();state='dead';}
  if(state==='playing'||state==='menu')render();
  requestAnimationFrame(gameLoop);
}

function startGame(){
  initWorld();var sp;
  if(selSpecies>=VIRUS_ID_START){sp=SPECIES_DB[0];selSpecies=0;}
  else sp=SPECIES_DB[selSpecies];
  var d=rng(PD*0.2,PD*0.5),hw=halfW(d)-20;
  player=spawnOrg(sp,rng(-hw,hw),d,true);
  if(!player)player=spawnOrg(sp,0,PD*0.3,true);
  player.energy=80;cam.x=player.x;cam.y=player.y;state='playing';gt=0;fc=0;
  document.getElementById('menuO').className='ov';document.getElementById('hud').style.display='block';
  document.getElementById('spdBar').style.display='flex';document.getElementById('todWrap').style.display='flex';
  document.getElementById('actBar').style.display='flex';document.getElementById('keyHint').style.display='flex';
  document.getElementById('scaleW').style.display='block';
  var tw=document.getElementById('todWrap');
  tw.innerHTML='<input type="range" id="todR" min="0" max="24" step="0.05" value="'+tod+'"><span id="todL">12:00</span><span id="seasL">'+tt('season1')+'</span>';
  var sl=document.getElementById('todR');
  sl.addEventListener('mousedown',function(){sliderDragging=true;});
  sl.addEventListener('mouseup',function(){sliderDragging=false;tod=parseFloat(sl.value);});
  sl.addEventListener('input',function(){tod=parseFloat(sl.value);updateTodUI();});
  sl.addEventListener('touchstart',function(){sliderDragging=true;});
  sl.addEventListener('touchend',function(){sliderDragging=false;tod=parseFloat(sl.value);});
  showSpeedBar();updateLegend();updateEcoPanel();
}

// === EVENT LISTENERS ===
cv.addEventListener('mousemove',function(e){var r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;});
cv.addEventListener('mousedown',function(e){e.preventDefault();var r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;
  if(e.button===0)mouseDown=true;
  if(e.button===2){var wx=cam.x+(mx-cv.width/2)/zoom,wy=cam.y+(my-cv.height/2)/zoom;moveTarget={x:wx,y:wy};}});
cv.addEventListener('mouseup',function(e){if(e.button===0)mouseDown=false;});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
cv.addEventListener('wheel',function(e){e.preventDefault();tZoom=clamp(tZoom*(e.deltaY>0?0.85:1.15),0.4,25);},{passive:false});

var touchId=null;
cv.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];var r=cv.getBoundingClientRect();mx=t.clientX-r.left;my=t.clientY-r.top;mouseDown=true;touchId=t.identifier;},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();for(var i=0;i<e.touches.length;i++){var t=e.touches[i];if(t.identifier===touchId){var r=cv.getBoundingClientRect();mx=t.clientX-r.left;my=t.clientY-r.top;break;}}},{passive:false});
cv.addEventListener('touchend',function(e){mouseDown=false;if(e.touches.length===0)touchId=null;},{passive:false});

document.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();keys[k]=true;
  if(k==='w'||k==='a'||k==='s'||k==='d'){if(freeCam)camKeys[k]=true;e.preventDefault();}
  if(k==='tab'){e.preventDefault();if(player&&player.alive)autoAI=!autoAI;}
  if(k==='f'){freeCam=!freeCam;camKeys={w:false,a:false,s:false,d:false};}
  if(k==='v'){freeCam=false;autoAI=false;}
  if(k==='b'){var wo=document.getElementById('wikiO');if(wo.className==='ov show')wo.className='ov';else{buildWiki();wo.className='ov show';}}
  if(k==='e'){if(player&&player.alive&&!player.dying){var best=null,bd=99999;var fc2=FOOD[player.sp.cat]||[];
    for(var i=0;i<orgs.length;i++){var p=orgs[i];if(!p.alive||p===player||p.cyst||p.divCD>0)continue;
      if(fc2.indexOf(p.sp.cat)<0)continue;if(p.size>=player.size*0.88)continue;var d=dist2(player,p);if(d<bd){bd=d;best=p;}}
    if(best&&bd<(player.size+best.sp.size+40)*(player.size+best.sp.size+40))eatOrg(player,best);}}
  if(k==='q'){if(player&&player.alive)doDivide(player);}
  if(k==='r'){if(player&&player.alive)doCyst(player);}
  if(k==='p'){if(state==='playing'){state='paused';document.getElementById('pauseO').className='ov show';}else if(state==='paused'){state='playing';document.getElementById('pauseO').className='ov';}}
});
document.addEventListener('keyup',function(e){var k=e.key.toLowerCase();keys[k]=false;if(k==='w'||k==='a'||k==='s'||k==='d')camKeys[k]=false;});

mm.addEventListener('click',function(e){var r=mm.getBoundingClientRect();var cx=(e.clientX-r.left-5)/(110-10)*PW*2-PW;var cy=(e.clientY-r.top-5)/(80-10)*PD;cam.x=cx;cam.y=cy;freeCam=true;});

document.getElementById('bEat').onclick=function(){if(player&&player.alive){var best=null,bd=99999;var fc2=FOOD[player.sp.cat]||[];
  for(var i=0;i<orgs.length;i++){var p=orgs[i];if(!p.alive||p===player||p.cyst||p.divCD>0)continue;if(fc2.indexOf(p.sp.cat)<0)continue;if(p.size>=player.size*0.88)continue;var d=dist2(player,p);if(d<bd){bd=d;best=p;}}
  if(best&&bd<(player.size+best.sp.size+40)*(player.size+best.sp.size+40))eatOrg(player,best);}};

document.getElementById('bCyst').onclick=function(){if(player&&player.alive)doCyst(player);};
document.getElementById('bAuto').onclick=function(){if(player&&player.alive)autoAI=!autoAI;};
document.getElementById('bFree').onclick=function(){freeCam=!freeCam;camKeys={w:false,a:false,s:false,d:false};};
