<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background: deep teal water gradient -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0a4a52"/>
      <stop offset="100%" stop-color="#022830"/>
    </radialGradient>
    <radialGradient id="cell" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#5ed4a0"/>
      <stop offset="50%" stop-color="#3a9e6a"/>
      <stop offset="100%" stop-color="#1a5e3a"/>
    </radialGradient>
    <radialGradient id="cell2" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#7fc8e8"/>
      <stop offset="50%" stop-color="#4a9ec8"/>
      <stop offset="100%" stop-color="#1a5e7a"/>
    </radialGradient>
    <radialGradient id="cell3" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f0d878"/>
      <stop offset="50%" stop-color="#c8a848"/>
      <stop offset="100%" stop-color="#8a6e28"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" rx="80"/>
  
  <!-- Main cell (large green coccus) -->
  <circle cx="256" cy="220" r="100" fill="url(#cell)" stroke="#5ed4a0" stroke-width="2" opacity="0.95"/>
  <!-- Internal structures -->
  <circle cx="240" cy="210" r="15" fill="#1a5e3a" opacity="0.5"/>
  <circle cx="280" cy="195" r="10" fill="#1a5e3a" opacity="0.4"/>
  <circle cx="260" cy="240" r="12" fill="#1a5e3a" opacity="0.45"/>
  <!-- Specular highlight -->
  <ellipse cx="225" cy="185" rx="30" ry="18" fill="rgba(255,255,255,0.25)" transform="rotate(-30 225 185)"/>
  
  <!-- Small blue rod cell -->
  <rect x="130" y="320" width="70" height="28" rx="14" fill="url(#cell2)" opacity="0.9"/>
  <ellipse cx="140" cy="325" rx="15" ry="7" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Small yellow sphere -->
  <circle cx="370" cy="340" r="32" fill="url(#cell3)" opacity="0.85"/>
  <ellipse cx="360" cy="328" rx="10" ry="6" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Spiral cell -->
  <path d="M 350 160 Q 400 170, 410 190 T 440 220" stroke="#5ed4a0" stroke-width="6" fill="none" opacity="0.7" stroke-linecap="round"/>
  
  <!-- Tiny dots (nutrients/particles) -->
  <circle cx="100" cy="150" r="4" fill="#5ed4a0" opacity="0.4"/>
  <circle cx="420" cy="100" r="3" fill="#7fc8e8" opacity="0.5"/>
  <circle cx="80" cy="280" r="5" fill="#f0d878" opacity="0.3"/>
  <circle cx="440" cy="380" r="4" fill="#5ed4a0" opacity="0.4"/>
  <circle cx="180" cy="100" r="3" fill="#7fc8e8" opacity="0.3"/>
</svg>