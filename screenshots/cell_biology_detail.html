
<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Cell Biology Detail</title>
<style>body{margin:0;background:#001020;display:flex;flex-wrap:wrap;justify-content:center}canvas{border:1px solid #345;margin:10px}</style>
</head><body>
<canvas id="c1" width="400" height="400"></canvas>
<canvas id="c2" width="400" height="400"></canvas>
<canvas id="c3" width="400" height="400"></canvas>
<canvas id="c4" width="400" height="400"></canvas>
<script>
// Render 4 cell types with full organelle detail
var cells = [
  {name:"Eukaryotic Algae (Chlamydomonas)", shape:"oval", color:"#4a4", size:80,
   organs:[
     {t:"nuc",x:0,y:0,r:25},
     {t:"chl",x:-30,y:-15,rx:18,ry:12,rot:0.3},
     {t:"chl",x:30,y:-15,rx:18,ry:12,rot:-0.3},
     {t:"chl",x:0,y:30,rx:15,ry:10,rot:0},
     {t:"mito",x:-20,y:20,rx:12,ry:6,rot:0.5},
     {t:"mito",x:25,y:25,rx:10,ry:5,rot:-0.3},
     {t:"vac",x:35,y:-25,r:8,c:"rgba(200,180,80,0.4)"},
     {t:"cv",x:0,y:-35,r:6,c:"rgba(80,160,240,0.6)"},
     {t:"eye",x:20,y:-30,r:5},
     {t:"er",x:-10,y:10,rx:20,ry:8,rot:0.2,c:"rgba(180,140,120,0.3)"},
     {t:"golgi",x:-25,y:5,r:15,c:"rgba(180,140,200,0.4)"},
     {t:"lyso",x:15,y:15,r:4},
     {t:"perox",x:-15,y:-20,r:3},
   ],
   bio:{flag:true,cilia:false}
  },
  {name:"Ciliate (Paramecium)", shape:"slipper", color:"#4af", size:90,
   organs:[
     {t:"mac",x:10,y:0,r:25},
     {t:"mic",x:-20,y:-10,r:8,c:"rgba(140,80,140,0.8)"},
     {t:"oral",x:30,y:-10,r:15,c:"rgba(100,150,200,0.4)"},
     {t:"vac",x:-15,y:15,r:10,c:"rgba(200,170,80,0.4)"},
     {t:"cv",x:-25,y:5,r:7,c:"rgba(80,160,240,0.6)"},
     {t:"mito",x:20,y:20,rx:10,ry:5,rot:0.3},
     {t:"trich",x:35,y:5,r:0,c:"rgba(200,220,255,0.3)"},
     {t:"trich",x:30,y:15,r:0,c:"rgba(200,220,255,0.3)"},
   ],
   bio:{flag:false,cilia:true,pellicle:true}
  },
  {name:"Predator (Actinosphaerium)", shape:"star", color:"#f84", size:85,
   organs:[
     {t:"nuc",x:0,y:0,r:20},
     {t:"nuc2",x:15,y:10,r:10,c:"rgba(160,80,160,0.6)"},
     {t:"vac",x:-20,y:-10,r:12,c:"rgba(200,170,80,0.4)"},
     {t:"vac",x:25,y:-5,r:10,c:"rgba(200,170,80,0.4)"},
     {t:"mito",x:-10,y:20,rx:12,ry:6,rot:0.5},
     {t:"mito",x:15,y:25,rx:10,ry:5,rot:-0.2},
     {t:"er",x:0,y:-15,rx:25,ry:10,rot:0.1,c:"rgba(180,140,120,0.3)"},
   ],
   bio:{flag:false,cilia:false,pseudo:true}
  },
  {name:"Fungal Cell (Yeast)", shape:"oval", color:"#ca8", size:75,
   organs:[
     {t:"nuc",x:0,y:0,r:22},
     {t:"vac",x:20,y:15,r:15,c:"rgba(200,170,80,0.4)"},
     {t:"mito",x:-20,y:10,rx:12,ry:6,rot:0.3},
     {t:"er",x:-5,y:-15,rx:20,ry:8,rot:0.2,c:"rgba(180,140,120,0.3)"},
     {t:"golgi",x:15,y:-10,r:12,c:"rgba(180,140,200,0.4)"},
     {t:"lyso",x:-15,y:-5,r:4},
     {t:"ribo",x:5,y:20,r:2,c:"rgba(80,60,40,0.6)"},
     {t:"ribo",x:-10,y:15,r:2,c:"rgba(80,60,40,0.6)"},
     {t:"ribo",x:20,y:-5,r:2,c:"rgba(80,60,40,0.6)"},
   ],
   bio:{flag:false,cilia:false,wall:true,bud:true}
  }
];

var pulse=0;
function render(){
  pulse+=0.05;
  for(var ci=0;ci<4;ci++){
    var cv=document.getElementById('c'+(ci+1));
    var ctx=cv.getContext('2d');
    var cell=cells[ci];
    ctx.clearRect(0,0,cv.width,cv.height);
    // Background
    ctx.fillStyle='#001530';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.save();ctx.translate(200,200);
    
    // Cell body
    var cyto=ctx.createRadialGradient(-cell.size*0.25,-cell.size*0.25,0,0,0,cell.size*1.1);
    cyto.addColorStop(0,cell.color);cyto.addColorStop(0.7,cell.color);cyto.addColorStop(1,'#246');
    ctx.fillStyle=cyto;ctx.strokeStyle='#246';ctx.lineWidth=3;
    ctx.beginPath();
    if(cell.shape==='oval'){ctx.ellipse(0,0,cell.size*1.1,cell.size*0.7,0,0,Math.PI*2);}
    else if(cell.shape==='slipper'){ctx.moveTo(cell.size,0);ctx.bezierCurveTo(cell.size,-cell.size*0.65,-cell.size*0.8,-cell.size*0.65,-cell.size,0);ctx.bezierCurveTo(-cell.size*0.8,cell.size*0.65,cell.size,cell.size*0.65,cell.size,0);}
    else if(cell.shape==='star'){for(var i=0;i<=24;i++){var a=i/24*Math.PI*2,r=i%2===0?cell.size*1.3:cell.size*0.6;if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}}
    ctx.fill();ctx.stroke();
    
    // Cell wall (double layer)
    if(cell.bio.wall){ctx.lineWidth=5;ctx.strokeStyle='rgba(100,80,50,0.4)';ctx.stroke();}
    
    // Organelles
    for(var oi=0;oi<cell.organs.length;oi++){
      var g=cell.organs[oi];
      ctx.save();
      if(g.t==='nuc'){
        var ng=ctx.createRadialGradient(g.x-g.r*0.2,g.y-g.r*0.2,0,g.x,g.y,g.r);
        ng.addColorStop(0,'rgba(180,120,200,0.9)');ng.addColorStop(0.7,'rgba(130,70,150,0.85)');ng.addColorStop(1,'rgba(80,30,100,0.95)');
        ctx.fillStyle=ng;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();
        // DNA helix
        ctx.strokeStyle='rgba(100,180,255,0.5)';ctx.lineWidth=1.5;
        ctx.beginPath();
        for(var ds=0;ds<=40;ds++){var dt=ds/40;var da=dt*Math.PI*4+pulse*0.5;var dx=g.x+Math.cos(da)*g.r*0.55*dt;var dy=g.y-g.r*0.4+dt*g.r*0.8;var dz=Math.sin(da)*g.r*0.2;var px=dx+dz*0.5;if(ds===0)ctx.moveTo(px,dy);else ctx.lineTo(px,dy);}
        ctx.stroke();
        ctx.strokeStyle='rgba(255,120,120,0.5)';ctx.lineWidth=1.5;
        ctx.beginPath();
        for(var ds=0;ds<=40;ds++){var dt=ds/40;var da=dt*Math.PI*4+pulse*0.5+Math.PI;var dx=g.x+Math.cos(da)*g.r*0.55*dt;var dy=g.y-g.r*0.4+dt*g.r*0.8;var dz=Math.sin(da)*g.r*0.2;var px=dx+dz*0.5;if(ds===0)ctx.moveTo(px,dy);else ctx.lineTo(px,dy);}
        ctx.stroke();
        // Nuclear pores
        ctx.fillStyle='rgba(220,180,240,0.7)';
        for(var p=0;p<8;p++){var pa=p/8*Math.PI*2;ctx.beginPath();ctx.arc(g.x+Math.cos(pa)*g.r*0.9,g.y+Math.sin(pa)*g.r*0.9,g.r*0.06,0,Math.PI*2);ctx.fill();}
        // Nucleolus
        var ncg=ctx.createRadialGradient(g.x+g.r*0.1,g.y+g.r*0.1,0,g.x+g.r*0.2,g.y+g.r*0.1,g.r*0.4);
        ncg.addColorStop(0,'rgba(230,150,230,1)');ncg.addColorStop(1,'rgba(150,50,150,0.9)');
        ctx.fillStyle=ncg;ctx.beginPath();ctx.arc(g.x+g.r*0.2,g.y+g.r*0.1,g.r*0.4,0,Math.PI*2);ctx.fill();
      }
      else if(g.t==='mac'){
        ctx.fillStyle='rgba(160,80,160,0.8)';ctx.beginPath();ctx.ellipse(g.x,g.y,g.r,g.r*0.6,0,0,Math.PI*2);ctx.fill();
      }
      else if(g.t==='mic'){ctx.fillStyle=g.c||'rgba(140,80,140,0.8)';ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();}
      else if(g.t==='chl'){
        ctx.save();ctx.translate(g.x,g.y);ctx.rotate((g.rot||0)+pulse*0.2);
        var cg=ctx.createRadialGradient(0,0,0,0,0,g.rx);
        cg.addColorStop(0,'#5fd45f');cg.addColorStop(0.7,'#2a8a2a');cg.addColorStop(1,'#1a5a1a');
        ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(0,0,g.rx,g.ry,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='rgba(15,60,15,0.6)';
        for(var gr2=0;gr2<4;gr2++){ctx.beginPath();ctx.ellipse(-g.rx*0.4+gr2*g.rx*0.25,(Math.sin(gr2*3)*g.ry*0.3),g.rx*0.12,g.ry*0.15,0,0,Math.PI*2);ctx.fill();}
        ctx.restore();
      }
      else if(g.t==='mito'){
        ctx.save();ctx.translate(g.x,g.y);ctx.rotate(g.rot||0);
        var mg=ctx.createLinearGradient(0,-g.ry,0,g.ry);
        mg.addColorStop(0,'rgba(230,110,110,0.8)');mg.addColorStop(1,'rgba(180,50,50,0.8)');
        ctx.fillStyle=mg;ctx.beginPath();ctx.ellipse(0,0,g.rx,g.ry,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(140,30,30,0.6)';ctx.lineWidth=1;
        for(var ci3=0;ci3<5;ci3++){var cx2=-g.rx*0.7+ci3*g.rx*0.3;ctx.beginPath();ctx.moveTo(cx2,-g.ry*0.5);ctx.quadraticCurveTo(cx2+g.rx*0.08,0,cx2,g.ry*0.5);ctx.stroke();}
        ctx.restore();
      }
      else if(g.t==='vac'){ctx.fillStyle=g.c||'rgba(200,170,80,0.4)';ctx.globalAlpha=0.45;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(200,170,80,0.4)';ctx.lineWidth=1;ctx.stroke();ctx.globalAlpha=1;}
      else if(g.t==='cv'){var pr=g.r+Math.sin(pulse*2)*g.r*0.3;ctx.fillStyle=g.c||'rgba(80,160,240,0.6)';ctx.beginPath();ctx.arc(g.x,g.y,pr,0,Math.PI*2);ctx.fill();}
      else if(g.t==='eye'){ctx.fillStyle='#cc4400';ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff7700';ctx.beginPath();ctx.arc(g.x-g.r*0.2,g.y-g.r*0.2,g.r*0.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.arc(g.x-g.r*0.3,g.y-g.r*0.3,g.r*0.25,0,Math.PI*2);ctx.fill();}
      else if(g.t==='er'){ctx.strokeStyle='rgba(180,140,120,0.4)';ctx.lineWidth=2;ctx.save();ctx.translate(g.x,g.y);ctx.rotate(g.rot||0);for(var et=0;et<4;et++){var eo=et*g.rx*0.2-g.rx*0.3;ctx.beginPath();ctx.moveTo(eo,-g.ry*0.5);ctx.quadraticCurveTo(eo+g.rx*0.1,-g.ry*0.2,eo+g.rx*0.05,g.ry*0.5);ctx.stroke();}ctx.restore();}
      else if(g.t==='golgi'){ctx.strokeStyle='rgba(180,140,200,0.5)';ctx.lineWidth=2;for(var gs2=0;gs2<5;gs2++){var goff=(gs2-2)*g.r*0.25;ctx.beginPath();ctx.ellipse(g.x,g.y+goff,g.r*(1-Math.abs(goff)/(g.r*2)),g.r*0.1,0,0,Math.PI*2);ctx.stroke();}}
      else if(g.t==='lyso'){ctx.fillStyle='rgba(100,70,30,0.7)';ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();}
      else if(g.t==='perox'){ctx.fillStyle='rgba(200,180,80,0.6)';ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();}
      else if(g.t==='oral'){ctx.fillStyle=g.c;ctx.globalAlpha=0.4;ctx.beginPath();ctx.ellipse(g.x,g.y,g.r,g.r*0.6,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
      else if(g.t==='trich'){ctx.strokeStyle='rgba(200,220,255,0.5)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(g.x,g.y);ctx.lineTo(g.x+15,g.y);ctx.stroke();for(var ts=0;ts<5;ts++){ctx.beginPath();ctx.moveTo(g.x+ts*3,g.y-2);ctx.lineTo(g.x+ts*3,g.y+2);ctx.stroke();}}
      else if(g.t==='ribo'){ctx.fillStyle=g.c||'rgba(80,60,40,0.6)';ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();}
      ctx.restore();
    }
    
    // Flagellum
    if(cell.bio.flag){
      var sx=-cell.size*0.9;
      ctx.lineWidth=3;ctx.strokeStyle='rgba(220,240,255,0.7)';
      ctx.beginPath();ctx.moveTo(sx,0);
      for(var w=0;w<=24;w++){var t=w/24;var wx=sx-t*cell.size*2.2;var amp=cell.size*(0.08+t*t*0.6);var wy=Math.sin(pulse*2+w*0.6)*amp;if(t>0.7){var curl=(t-0.7)/0.3;wy+=Math.cos(pulse*3+w)*cell.size*0.15*curl;}ctx.lineTo(wx,wy);}
      ctx.stroke();
    }
    // Cilia
    if(cell.bio.cilia){var cn=20;
      for(var c=0;c<cn;c++){
        var a=c/cn*Math.PI*2;var phaseOffset=c*0.4;var beat=Math.sin(pulse*2+phaseOffset);var ext=0.5+beat*0.5;
        var r1=cell.size*0.85,r2=cell.size*(1.0+ext*0.35);
        ctx.strokeStyle='rgba(200,220,255,'+(0.3+ext*0.3)+')';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);
        ctx.quadraticCurveTo(Math.cos(a)*(r1+r2)/2+Math.sin(a)*cell.size*0.05,Math.sin(a)*(r1+r2)/2-Math.cos(a)*cell.size*0.05,Math.cos(a)*r2,Math.sin(a)*r2);
        ctx.stroke();
      }
    }
    // Pseudopodia
    if(cell.bio.pseudo){var pn=6;
      for(var p=0;p<pn;p++){var a=p/pn*Math.PI*2+Math.sin(pulse)*0.3;var ext=cell.size*0.4+Math.sin(pulse+p*1.5)*cell.size*0.35;
        ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(Math.cos(a)*cell.size*0.7,Math.sin(a)*cell.size*0.7,Math.cos(a)*(cell.size+ext),Math.sin(a)*(cell.size+ext));
        ctx.lineWidth=5;ctx.strokeStyle='rgba(200,220,255,0.15)';ctx.stroke();}
    }
    
    ctx.restore();
    // Label
    ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText(cell.name,200,390);
  }
  requestAnimationFrame(render);
}
render();
</script></body></html>
